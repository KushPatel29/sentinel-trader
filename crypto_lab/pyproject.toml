[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-crypto-lab"
version = "0.2.0"
description = "Auditable crypto research and forward paper simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "scipy>=1.13,<2", "requests>=2.31,<3", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
sentinel-crypto = "sentinel_crypto.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_crypto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
