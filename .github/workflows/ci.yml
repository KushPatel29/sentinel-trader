name: ci

on:
  push:
  pull_request:

jobs:
  neural-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r crypto_lab/requirements-neural.txt
      - run: python -m pytest -q crypto_lab/tests/test_challengers.py
        env:
          PYTHONPATH: crypto_lab
  public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q crypto_lab/tests/test_accuracy_release.py
        env:
          PYTHONPATH: crypto_lab
  crypto-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: crypto_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,dashboard]"
      - run: python -m pytest -q
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Offline pipeline smoke test (synthetic data)
        run: |
          sentinel fetch --synthetic --days 260
          sentinel train --holdout-days 10
          sentinel backtest
          sentinel replay --days 5
