[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-trader"
version = "0.1.0"
description = "Modular ML + news-sentiment trading bot for US equities on Alpaca (paper trading by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kush Patel" }]
dependencies = [
    "alpaca-py>=0.30",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "yfinance>=0.2.54",
    "requests>=2.31",
    "tzdata>=2024.1",          # Windows has no system time-zone database
]

[project.optional-dependencies]
nlp = ["transformers>=4.40", "torch>=2.2"]
llm = ["anthropic>=0.40"]
dashboard = ["streamlit>=1.45", "plotly>=5.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E501"]
"src/sentinel/analyzer/engine.py" = ["E501"]
"src/sentinel/gold/model.py" = ["E501"]
"src/sentinel/gold/extra.py" = ["E501"]
"gold_app.py" = ["E501"]
"gold_bot.py" = ["E501"]
